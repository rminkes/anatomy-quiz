<style>

  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .controls { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .controls label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .controls select { font-size: 14px; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .qt-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .qt-btn { font-size: 12px; padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
  .qt-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .qt-btn.active { background: var(--blue); color: var(--blue-light); border-color: var(--blue); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .img-box { width: 100%; height: 300px; background: #f0ede6; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border); }
  .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .img-placeholder { text-align: center; color: var(--text-faint); font-size: 13px; }
  .q-body { padding: 1.5rem; }
  .q-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .q-text { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 1.25rem; line-height: 1.5; }
  .muscle-tag { display: inline-block; font-size: 13px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); padding: 5px 12px; border-radius: var(--radius-sm); margin-bottom: 1.25rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { padding: 11px 15px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer; text-align: left; line-height: 1.4; transition: all 0.12s; font-family: inherit; }
  .choice:hover:not(:disabled) { background: var(--surface); border-color: var(--border-strong); }
  .choice.correct { background: var(--green-light); border-color: var(--green-border); color: var(--green); font-weight: 500; }
  .choice.wrong { background: var(--red-light); border-color: var(--red-border); color: var(--red); }
  .choice:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 11px 15px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.6; display: none; }
  .feedback.correct { background: var(--green-light); color: var(--green); display: block; border: 1px solid var(--green-border); }
  .feedback.wrong { background: var(--red-light); color: var(--red); display: block; border: 1px solid var(--red-border); }
  .next-row { margin-top: 1rem; display: none; }
  .btn-next { padding: 9px 22px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; cursor: pointer; transition: all 0.12s; box-shadow: var(--shadow); }
  .btn-next:hover { border-color: var(--blue); color: var(--blue); }
  .score-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; gap: 24px; box-shadow: var(--shadow); }
  .score-item { font-size: 13px; color: var(--text-muted); }
  .score-item span { font-weight: 600; color: var(--text); margin-left: 4px; }
  .status { padding: 3rem 2rem; text-align: center; color: var(--text-muted); font-size: 14px; }
  @media (max-width: 480px) { .choices { grid-template-columns: 1fr; } body { padding: 1rem 0.75rem; } }
</style>

    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function init() {
  // Restore saved score display on load
  document.getElementById("sc-correct").textContent = score.correct;
  document.getElementById("sc-attempted").textContent = score.attempted;
  document.getElementById("sc-streak").textContent = score.streak;

  const sel = document.getElementById("region-sel");
  sel.innerHTML = DATA.index.map((r, i) => `<option value="${i}">${r.label}</option>`).join("");
  sel.onchange = () => loadRegion(DATA.index[+sel.value]);
  buildQTBar();
  loadRegion(DATA.index[0]);
}

function buildQTBar() {
  document.getElementById("qt-bar").innerHTML = QT.map(q =>
    `<button class="qt-btn${activeTypes.has(q.key) ? " active" : ""}" data-k="${q.key}">${q.label}</button>`
  ).join("");
  document.querySelectorAll(".qt-btn").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if (activeTypes.has(k)) { if (activeTypes.size > 1) activeTypes.delete(k); }
      else activeTypes.add(k);
      buildQTBar();
      questionDeck = buildDeck();
      deckIndex = 0;
      nextQuestion();
    };
  });
}

function loadRegion(region) {
  activeRegion = region;
  muscles = DATA[region.key];
  questionDeck = buildDeck();
  deckIndex = 0;
  nextQuestion();
}

const rand = arr => arr[Math.floor(Math.random() * arr.length)];

function nextQuestion() {
  answered = false;
  if (!questionDeck.length) { document.getElementById("quiz").innerHTML = `<div class="status">No muscles match selected question types.</div>`; return; }
  if (deckIndex >= questionDeck.length) {
    questionDeck = buildDeck();
    deckIndex = 0;
  }
  const { muscle, qType } = questionDeck[deckIndex++];
  const correct = muscle.qa[qType];
  const wrongPool = muscles.filter(m => m.id !== muscle.id && m.qa[qType] && m.qa[qType] !== correct);
  const used = new Set([correct]);
  const wrongs = [];
  for (const m of wrongPool.sort(() => Math.random() - 0.5)) {
    if (!used.has(m.qa[qType])) { wrongs.push(m.qa[qType]); used.add(m.qa[qType]); }
    if (wrongs.length === 3) break;
  }
  if (wrongs.length < 3) {
    const fallbacks = {
      name:            ["Deltoid","Teres Major","Coracobrachialis","Biceps Brachii","Triceps Brachii","Pectoralis Minor","Serratus Anterior","Rhomboid Major"],
      innervation:     ["Axillary nerve","Musculocutaneous nerve","Radial nerve","Median nerve","Ulnar nerve","Suprascapular nerve","Long thoracic nerve","Thoracodorsal nerve"],
      function:        ["Flexion of the elbow","Extension of the shoulder","Abduction of the arm","Adduction of the arm","Internal rotation of the arm","External rotation of the arm","Scapular retraction","Scapular protraction"],
      opposing_muscle: ["Deltoid","Teres Major","Biceps Brachii","Triceps Brachii","Pectoralis Major","Latissimus Dorsi","Coracobrachialis","Serratus Anterior"],
      spinal_levels:   ["C4, C5","C6, C7","C7, C8","C5, C6, C7","C4, C5, C6","C6, C7, C8","C8, T1","C5"],
      origin:          ["Coracoid process of the scapula","Acromion of the scapula","Spine of the scapula","Glenoid labrum","Posterior scapula","Clavicle","Medial border of the scapula","Inferior angle of the scapula"],
      insertion:       ["Greater tubercle of the humerus","Lesser tubercle of the humerus","Intertubercular groove","Deltoid tuberosity","Radial tuberosity","Medial epicondyle","Coracoid process","Bicipital aponeurosis"],
    };
    const pool = (fallbacks[qType] || fallbacks.name).filter(x => !used.has(x)).sort(() => Math.random() - 0.5);
    for (const f of pool) {
      if (wrongs.length === 3) break;
      wrongs.push(f);
      used.add(f);
    }
  }
  currentQ = { muscle, qType, correct, choices: [correct, ...wrongs].sort(() => Math.random() - 0.5) };
  render();
}

const qText = (t) => ({
  name:            "What muscle is indicated?",
  innervation:     "What nerve innervates this muscle?",
  function:        "What is the primary function of this muscle?",
  opposing_muscle: "What is the primary opposing muscle?",
  spinal_levels:   "What spinal levels supply this muscle?",
  origin:          "Where does this muscle originate?",
  insertion:       "Where does this muscle insert?",
}[t] || "What is this muscle's " + t + "?");

function render() {
  const { muscle, qType, correct, choices } = currentQ;
  const rawUrl = muscle.image_url;
  const hasImg = rawUrl && rawUrl !== "PASTE_YOUR_URL_HERE";
  const imgHTML = hasImg
    ? `<div class="img-box"><img src="${rawUrl}" alt="${muscle.structure_labeled}" onerror="this.parentElement.innerHTML='<div class=&quot;img-placeholder&quot;>Image unavailable</div>'"/></div>`
    : `<div class="img-box"><div class="img-placeholder">No image — add image URL to data</div></div>`;
  const tag = "";

  document.getElementById("quiz").innerHTML = `
    <div class="card">
      ${imgHTML}
      <div class="q-body">
        <div class="q-label">${muscle.region} &mdash; ${activeRegion.label}</div>
        <div class="q-text">${qText(qType)}</div>
        ${tag}
        <div class="choices">
          ${choices.map(c => `<button class="choice" data-val="${c.replace(/"/g,'&quot;')}">${c}</button>`).join("")}
        </div>
        <div id="feedback" class="feedback"></div>
        <div class="next-row" id="next-row"><button class="btn-next" id="btn-next">Next question &rarr;</button></div>
      </div>
    </div>`;

  document.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(b.dataset.val, b));
  document.getElementById("btn-next").onclick = nextQuestion;
}

function answer(val, btn) {
  if (answered) return;
  answered = true;
  score.attempted++;
  const ok = val === currentQ.correct;
  if (ok) { score.correct++; score.streak++; } else { score.streak = 0; }
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.val === currentQ.correct) b.classList.add("correct");
    else if (b === btn && !ok) b.classList.add("wrong");
  });
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (ok ? "correct" : "wrong");
  fb.innerHTML = ok
    ? `<strong>Correct!</strong>${currentQ.muscle.qa.clinical_note ? " " + currentQ.muscle.qa.clinical_note : ""}`
    : `<strong>Incorrect.</strong> The answer is: ${currentQ.correct}`;
  document.getElementById("next-row").style.display = "block";
  document.getElementById("sc-correct").textContent = score.correct;
  document.getElementById("sc-attempted").textContent = score.attempted;
  document.getElementById("sc-streak").textContent = score.streak;
  saveScore(score);
}

init();
</script>
</body>
</html>
